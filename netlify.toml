[build]
  command = "npm run build"
  publish = "dist"

# www → non-www (must come first)
[[redirects]]
  from = "https://www.mcinallys.co.uk/*"
  to   = "https://mcinallys.co.uk/:splat"
  status = 301
  force  = true

# .html → clean URL redirects
